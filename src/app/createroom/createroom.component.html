<form (ngSubmit)="onSubmit()" #roomForm="ngForm">
    <div class="modal-header">
        <h5 class="modal-title">Ingresar Sala</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <label>Nombre del cuarto</label>
            <input type="text" [(ngModel)]="room.name" name="name" required class="form-control">
        </div>
        <div class="mb-3">
            <label>Capacidad</label>
            <input type="number" [(ngModel)]="room.capacity" name="capacity" required class="form-control">
        </div>
    </div>
    <div class="modal-footer">
        <button type="submit" class="btn btn-success">Guardar</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    </div>
</form>
