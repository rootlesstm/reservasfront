<form form [formGroup]="reservaForm" class="mt-5">
    <h4 class="text-center mb-4">Crear Reserva</h4>

    <div class="mb-3">
        <label class="form-label">Sala</label>
        <select class="form-select" formControlName="room_id">
            <option *ngFor="let sala of salas" [value]="sala.id">{{ sala.name }}</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Fecha</label>
        <input type="date" class="form-control" formControlName="created_at" />
    </div>

    <div class="mb-3">
        <label class="form-label">Hora Inicio</label>
        <input type="time" class="form-control" formControlName="start_time" />
    </div>

    <div class="mb-3">
        <label class="form-label">Hora Fin</label>
        <input type="time" class="form-control" formControlName="end_time" />
    </div>

    <div class="text-center">
        <button type="button" class="btn btn-primary" (click)="Reserver()">Reservar</button>
    </div>
</form>
